plugins {
    id 'java-library'
    id 'maven-publish'
}

// Stamp this plugin-less library with the framework's shared provenance writer.
apply from: resources.text.fromString(
        buildscript.classLoader.getResource('be/elevenways/protoblast/gradle/build-info.gradle').text)

configurations {
    loaderStub
    runtimeClasspath.extendsFrom(loaderStub)
    testRuntimeClasspath.extendsFrom(loaderStub)
}

configurations.all {
    resolutionStrategy {
        cacheChangingModulesFor 0, 'seconds'
    }
}

dependencies {
    // Protoblast is the ONLY runtime dependency: Dry supplies the JSON codec and
    // JobRunner the reader/pump threads. No Jackson, no Reactor, no SLF4J.
    api(libs.protoblast.server) {
        changing = true
    }

    // BlastAutoLoadInit for THIS project's own runtime. Declared on a private
    // configuration that only the LOCAL runtime classpaths extend, never in the
    // published POM: a consumer with a real generated loader would otherwise get
    // a duplicate FQN on its runtime classpath.
    loaderStub(libs.protoblast.loader.stub) {
        changing = true
    }

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    // The shared source-guard scanner: SourceGuardTest drives the workspace direct-clock-read rule over this
    // plugin-less library, which no marker-gated Gradle guard task can reach.
    testImplementation(libs.protoblast.source.guard) {
        changing = true
    }
    // Gradle 9 no longer auto-provides the JUnit Platform launcher.
    testRuntimeOnly libs.junit.launcher
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
